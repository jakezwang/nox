name: PR 1184 platform evidence
on:
  push:
    branches: [audit/pr-1184-platform-output-20260928]
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[tox-to-nox]' tox==4.64.4 pytest
      - run: python .github/repros/pr1184.py
      - run: python -m pytest tests/test_tox_to_nox.py -q --basetemp=.pytest-tmp
      - uses: actions/upload-artifact@v4
        with:
          name: platform-output-${{ matrix.os }}
          path: platform-output.json
